name: Release

on:
  release:
    types: [ published ]
  push:
    tags:
      - 'Ozark-Proton*-*'
      - 'GE-Proton*-*'

concurrency:
  group: ${{ github.ref_name }}
  # never cancel a live release mid-upload; a re-pushed tag waits its turn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Pass the build job's attestation scopes through the reusable-workflow call.
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build
    uses: ./.github/workflows/_job_build.yml
    with:
      name: ${{ github.ref_name }}

  release:
    timeout-minutes: 15
    name: Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Tags
      shell: bash
      run: |
        git fetch origin +refs/tags/*:refs/tags/*

    - name: Create Release
      id: create
      shell: bash
      run: |
        if gh release view "${{ github.ref_name }}" --repo "${{ github.server_url }}/${{ github.repository }}" &>/dev/null; then
          echo "Release ${{ github.ref_name }} already exists. Skipping creation."
        else
          # Preserve the tag annotation explicitly; gh rejects --notes-from-tag together with --repo.
          gh release create "${{ github.ref_name }}" \
            --latest \
            --title "${{ github.ref_name }}" \
            --notes "$(git tag --list "$GITHUB_REF_NAME" --format='%(contents)')" \
            --verify-tag \
            --repo "${{ github.server_url }}/${{ github.repository }}"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  upload:
    name: Upload
    needs: release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - name: ${{ github.ref_name }}
    uses: ./.github/workflows/_job_upload.yml
    with:
      version: ${{ github.ref_name }}
      name: ${{ matrix.name }}
