name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  proton:
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 360
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ccache-proton-${{ runner.os }}-${{ hashFiles('.gitmodules', 'patches/**', 'Makefile.in', 'docker/**') }}
          restore-keys: |
            ccache-proton-${{ runner.os }}-
            ccache-proton-

      - name: Patch
        run: |
          set -o pipefail
          git submodule update --init --filter=tree:0 --recursive
          # apply proton-ge-custom patches (fail fast — a broken tree must not go green)
          ./patches/protonprep-valve-staging.sh 2>&1 | tee patchlog.txt
          # strip binaries at compile time to save space in the runner
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          mkdir ./build

      - name: Upload patchlog.txt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patchlog.txt
          path: patchlog.txt

      - name: Configure
        working-directory: ./build
        run: |
          ../configure.sh --build-name=${{ inputs.name }} --container-engine=docker

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          make -j$(nproc) redist

      - name: Generate SHA-256 checksum
        working-directory: ./build
        env:
          BUILD_NAME: ${{ inputs.name }}
        run: sha256sum "$BUILD_NAME.tar.gz" > "$BUILD_NAME.tar.gz.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./build/${{ inputs.name }}.tar.gz

      - name: Save cache
        id: ccache-save
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact ${{ inputs.name }}.tar.gz
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}.tar.gz
          path: ./build/${{ inputs.name }}.tar.gz

      - name: Upload artifact ${{ inputs.name }}.sha512sum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}.sha512sum
          path: ./build/${{ inputs.name }}.sha512sum

      - name: Upload artifact ${{ inputs.name }}.tar.gz.sha256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}.tar.gz.sha256
          path: ./build/${{ inputs.name }}.tar.gz.sha256
