name: Validate

# Quick checks on every pull request. They catch broken workflow files and
# patch-script mistakes before merge, without doing a full build.
# Full builds run only when a release tag is pushed (see release.yml).
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'patches/protonprep-valve-staging.sh'
      - 'configure.sh'

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    name: Validate workflows and scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: YAML syntax check (workflows and Dependabot)
        shell: bash
        run: |
          python3 -c "
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + ['.github/dependabot.yml']):
              try:
                  yaml.safe_load(open(f))
                  print(f'OK   {f}')
              except yaml.YAMLError as e:
                  bad = 1
                  print(f'FAIL {f}: {e}')
          sys.exit(bad)
          "

      - name: Shell syntax check (build scripts)
        shell: bash
        run: |
          bash -n configure.sh
          bash -n patches/protonprep-valve-staging.sh
          echo "shell syntax OK"

      - name: Guard — patch step must fail fast
        shell: bash
        run: |
          # The CI Patch step must never swallow patch failures with '|| true'.
          # (A broken patch tree going green wastes hours of runner time.)
          if grep -n 'protonprep-valve-staging.sh || true' .github/workflows/_job_build.yml; then
            echo "ERROR: patch step swallows failures (|| true). Remove it so CI fails fast."
            exit 1
          fi
          if ! grep -qx 'set -e' patches/protonprep-valve-staging.sh; then
            echo "ERROR: protonprep must enable errexit so failed patches abort the build."
            exit 1
          fi
          echo "fail-fast guard OK"
