name: Upstream Sync

# Weekly: merge GloriousEggroll/proton-ge-custom master into a sync branch.
# Clean merge -> open/refresh a PR for review. Conflict -> job fails (visible in Actions).
# No untrusted event input is interpolated into run: steps.

on:
  schedule:
    - cron: '0 12 * * 1'   # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          submodules: false

      - name: Merge upstream GE
        id: merge
        shell: bash
        run: |
          git config user.name  "ozark-sync[bot]"
          git config user.email "ozark-sync@users.noreply.github.com"
          git remote add upstream https://github.com/GloriousEggroll/proton-ge-custom.git
          git fetch --no-tags upstream master
          behind=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then echo "Already up to date."; exit 0; fi
          git checkout -B upstream-sync
          git merge --no-edit upstream/master
          git push --force origin upstream-sync

      - name: Open or update PR
        if: steps.merge.outputs.behind != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          if gh pr view upstream-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr comment upstream-sync --body "Refreshed: $BEHIND upstream commits merged cleanly."
          elif ! gh pr create --base master --head upstream-sync \
              --title "Sync with upstream GE-Proton ($BEHIND commits)" \
              --body "Automated weekly merge of GloriousEggroll/proton-ge-custom master. Merged cleanly. Run tools/ozark-smoke.sh on a local build before tagging a release."; then
            # The usual cause is the repo setting, not this workflow's permissions block.
            echo "::error::Could not open the sync PR. Turn on 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General, or open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...upstream-sync"
            exit 1
          fi
